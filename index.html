['8000','Sparen & Geldanlage','Tiết kiệm, đầu tư','save'],

];

const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const SQL=`create table if not exists public.items (
  id uuid primary key,
  user_id uuid not null default auth.uid() references auth.users(id) on delete cascade,
  data text not null,
  deleted boolean not null default false,
  updated_at timestamptz not null default now()
);
create index if not exists items_user_upd on public.items (user_id, updated_at);
alter table public.items enable row level security;
drop policy if exists "own rows" on public.items;
create policy "own rows" on public.items for all to authenticated
  using (user_id = auth.uid()) with check (user_id = auth.uid());
create or replace function public.items_touch() returns trigger language plpgsql as
$$ begin new.updated_at = now(); return new; end $$;
drop trigger if exists items_touch on public.items;

/* ============ Helfer ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=v=>nf.format(v);
const fz=v=>Math.abs(v)<0.005?'':nf.format(v);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dDE=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const parseAmt=s=>{s=String(s).trim().replace(/[€\s]/g,'').replace('−','-');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:0};
const norm=s=>String(s||'').toLowerCase().replace(/[^a-zäöüßà-ỹ ]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).join(' ');
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder(),td=new TextDecoder();
const uuid=()=>crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
function toast(m){const t=document.createElement('div');t.textContent=m;t.className='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:50;max-width:90%';document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ============ Zustand ============ */
const S={key:null,authPw:null,token:null,items:new Map(),tab:'home',ym:today().slice(0,7),review:null,q:'',syncState:'',busy:false};
let cfg=JSON.parse(localStorage.getItem('hbwa.cfg')||'null');
const saveCfg=()=>localStorage.setItem('hbwa.cfg',JSON.stringify(cfg));

/* ============ Kryptografie (AES-256-GCM, PBKDF2) ============ */
async function derive(email,pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode('hbwa-v1|'+email.trim().toLowerCase()),iterations:600000},base,512));
  S.key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-GCM',false,['encrypt','decrypt']);
  S.authPw=[...bits.slice(32)].map(b=>b.toString(16).padStart(2,'0')).join('');
  bits.fill(0);
}
async function enc(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,te.encode(JSON.stringify(obj))));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function dec(s){const u=ub64(s);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},S.key,u.subarray(12))))}
async function setId(){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode('hbwa-set|'+cfg.email)));h[6]=h[6]&15|64;h[8]=h[8]&63|128;const x=[...h.slice(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('');return x.slice(0,8)+'-'+x.slice(8,12)+'-'+x.slice(12,16)+'-'+x.slice(16,20)+'-'+x.slice(20)}

/* ============ Lokaler Speicher (IndexedDB, nur verschlüsselt) ============ */
let _db;
function idb(){return _db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('hbwa',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function idbAll(){const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('items').objectStore('items').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function idbPut(rows){if(!rows.length)return;const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('items','readwrite');rows.forEach(x=>t.objectStore('items').put(x));t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function idbClear(){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('items','readwrite');t.objectStore('items').clear();t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}

async function loadAll(){
  S.items.clear();
  for(const r of await idbAll()){
    let p=null;if(!r.deleted){try{p=await dec(r.data)}catch(e){continue}}
    S.items.set(r.id,{id:r.id,p,deleted:!!r.deleted,dirty:!!r.dirty,updated_at:r.updated_at||null,data:r.data});
  }
}
async function put(id,p,deleted=false){
  const data=await enc(deleted?{k:'del'}:p);
  const it={id,p:deleted?null:p,deleted,dirty:true,updated_at:S.items.get(id)?.updated_at||null,data};
  S.items.set(id,it);
  await idbPut([{id,data,deleted,dirty:true,updated_at:it.updated_at}]);
}
const txs=()=>[...S.items.values()].filter(i=>!i.deleted&&i.p&&i.p.k==='tx');
let _setId;
function settings(){const it=S.items.get(_setId);return (it&&it.p)||{k:'set',gem:'',model:'gemini-3.6-flash',rules:{}}}
async function saveSettings(s){await put(_setId,s);kick()}

/* ============ Sync (Supabase – speichert nur Chiffretext) ============ */
async function login(){
  const r=await fetch(cfg.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.apikey,'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password:S.authPw})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){const e=new Error(j.error_description||j.msg||j.message||('HTTP '+r.status));e.code=j.error_code||j.error||'';throw e}
  S.token=j.access_token;
}
async function signup(){
  const r=await fetch(cfg.url+'/auth/v1/signup',{method:'POST',headers:{apikey:cfg.apikey,'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password:S.authPw})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.msg||j.error_description||j.message||('HTTP '+r.status));
  if(j.access_token){S.token=j.access_token;return true}
  return false;
}
async function rest(path,opt={},retry=true){
  if(!S.token)await login();
  const r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:{apikey:cfg.apikey,Authorization:'Bearer '+S.token,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401&&retry){S.token=null;return rest(path,opt,false)}
  if(!r.ok)throw new Error('Sync HTTP '+r.status+' '+(await r.text()).slice(0,200));
  return r.json();
}
let _syncing=false,_again=false,_kt;
function kick(){clearTimeout(_kt);_kt=setTimeout(sync,400)}
async function sync(){
  if(!S.key||!cfg||!cfg.url){setSync('');return}
  if(_syncing){_again=true;return}
  _syncing=true;setSync('⟳');let changed=false;
  try{
    // 1) holen
    for(;;){
      const cur=cfg.cursor||'1970-01-01T00:00:00Z';
      const rows=await rest('items?select=id,data,deleted,updated_at&updated_at=gt.'+encodeURIComponent(cur)+'&order=updated_at.asc&limit=500');
      if(!rows.length)break;
      const store=[];
      for(const r of rows){
        const loc=S.items.get(r.id);
        if(loc&&loc.dirty)continue;
        if(loc&&loc.updated_at===r.updated_at)continue;
        let p=null;if(!r.deleted){try{p=await dec(r.data)}catch(e){continue}}
        S.items.set(r.id,{id:r.id,p,deleted:r.deleted,dirty:false,updated_at:r.updated_at,data:r.data});
        store.push({id:r.id,data:r.data,deleted:r.deleted,dirty:false,updated_at:r.updated_at});changed=true;
      }
      await idbPut(store);
      cfg.cursor=rows[rows.length-1].updated_at;saveCfg();
      if(rows.length<500)break;
    }
    // 2) senden
    const dirty=[...S.items.values()].filter(i=>i.dirty);
    for(let i=0;i<dirty.length;i+=200){
      const chunk=dirty.slice(i,i+200);
      const res=await rest('items?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(chunk.map(c=>({id:c.id,data:c.data,deleted:c.deleted})))});
      const store=[];
      for(const r of res){const loc=S.items.get(r.id);if(loc&&loc.data===r.data){loc.dirty=false;loc.updated_at=r.updated_at;store.push({id:loc.id,data:loc.data,deleted:loc.deleted,dirty:false,updated_at:loc.updated_at})}}
      await idbPut(store);
    }
    cfg.lastSync=Date.now();saveCfg();setSync('●');
  }catch(e){setSync('⚠');S.syncErr=e.message}
  _syncing=false;
  if(changed&&!S.busy&&!$('sheet').classList.contains('on')&&!(S.tab==='imp'&&S.review))render();
  if(_again){_again=false;kick()}
}

/* ============ BWA-Rechnung ============ */
function rawSums(y,m1,m2){const a=y+'-'+pad(m1)+'-00',b=y+'-'+pad(m2)+'-99',o={};for(const t of txs()){const p=t.p;if(p.d>a&&p.d<b)o[p.c]=(o[p.c]||0)+p.a}return o}
function calc(raw){
  const v={},g={inc:0,life:0,home:0,other:0,save:0};
  for(const l of CATS){if(l[3]==='xfer')continue;const x=(raw[l[0]]||0)*(l[3]==='inc'?1:-1);v[l[0]]=x;g[l[3]]+=x}
  v['1049']=g.inc;v['1079']=g.life;v['1099']=g.inc-g.life;v['5990']=g.home;v['6998']=g.other;
  v['6999']=g.life+g.home+g.other;v['7001']=g.inc-v['6999'];v['9200']=v['7001']-g.save;return v;
}
function bwa(ym){const y=+ym.slice(0,4),m=+ym.slice(5,7);return{y,m,mi:calc(rawSums(y,m,m)),mv:calc(rawSums(y-1,m,m)),ci:calc(rawSums(y,1,m)),cv:calc(rawSums(y-1,1,m))}}
const pct=(v,base)=>Math.abs(base)<0.005||Math.abs(v)<0.005?'':nf.format(v/base*100);
function bwaTable(B){
  const cols=[B.mi,B.mv,B.ci,B.cv];
  let h=`<table class="bwa"><thead><tr><th rowspan="2">Bezeichnung · Hạng mục</th><th class="g" colspan="4">Monat · Tháng ${pad(B.m)}/${B.y}</th><th class="g" colspan="4">Aufgelaufen · Luỹ kế 01–${pad(B.m)}/${B.y}</th></tr>
  <tr><th>Ist-Wert</th><th>%</th><th>Vorjahr</th><th>% VJ</th><th>Ist-Wert</th><th>%</th><th>Vorjahr</th><th>% VJ</th></tr></thead><tbody>`;
  for(const l of LINES){
    const k=l[3]==='s'?'sum':l[3]==='h'?'hl':'cat';
    h+=`<tr class="${k}" ${k==='cat'?`onclick="openCat('${l[0]}')"`:''}><td><span class="no">${l[0]}</span>${esc(l[1])}<span class="vi">${esc(l[2])}</span></td>`;
    cols.forEach((c,i)=>{h+=`<td class="num${i===2?' sep':''}">${fz(c[l[0]])}</td><td class="num">${pct(c[l[0]],c['1049'])}</td>`});
    h+='</tr>';
  }
  return h+'</tbody></table>';
}

   generationConfig:{responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{bank:{type:'STRING'},transactions:{type:'ARRAY',items:{type:'OBJECT',properties:{date:{type:'STRING'},name:{type:'STRING'},purpose:{type:'STRING'},amount:{type:'NUMBER'},pending:{type:'BOOLEAN'},category:{type:'STRING'}},required:['date','name','amount','category']}}},required:['bank','transactions']}}};
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(s.model||'gemini-3.6-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.gem},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  const txt=((j.candidates||[])[0]?.content?.parts||[]).filter(p=>!p.thought&&p.text).map(p=>p.text).join('');
  return JSON.parse(txt.replace(/^```json\s*|\s*```$/g,''));
}
const dupKey=p=>p.d+'|'+Math.round(p.a*100)+'|'+norm(p.n);
async function runImport(files){
  files=[...files];if(!files.length)return;S.busy=true;
  $('imb').disabled=true;const rules=settings().rules||{};
  const have=new Set(txs().map(t=>dupKey(t.p)));const rows=[];const errs=[];
  for(let i=0;i<files.length;i++){
    $('ims').textContent=`Đang đọc ảnh ${i+1}/${files.length}…`;
    try{
      const res=await gemini(files[i]);const seen=new Set();
      const bank=BANKS.includes(res.bank)?res.bank:'Andere';
      for(const t of res.transactions||[]){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')||!isFinite(t.amount))continue;
        const p={d:t.date,n:String(t.name||'').slice(0,120),v:String(t.purpose||'').slice(0,200),a:Math.round(t.amount*100)/100,c:CAT[t.category]?t.category:(t.amount<0?'6900':'1005'),b:bank,pend:!!t.pending};
        const rk=rules[norm(p.n)];if(rk&&CAT[rk])p.c=rk;
        const k=dupKey(p);p.dup=have.has(k);p.sel=!p.dup;seen.add(k);rows.push(p);
      }
      seen.forEach(k=>have.add(k));
    }catch(e){errs.push(`Ảnh ${i+1}: ${e.message}`)}
  }
  S.busy=false;
  if(!rows.length){$('imb').disabled=false;$('ims').innerHTML=`<span class="err">${esc(errs.join('\n')||'Không tìm thấy giao dịch nào trong ảnh.')}</span>`;return}
  rows.sort((a,b)=>a.d<b.d?1:-1);S.review={rows,errs};render();
}
function vReview(){
  const R=S.review,n=R.rows.filter(r=>r.sel).length;
  return `<div class="card"><h2>Kiểm tra trước khi lưu</h2><div class="mut">Tìm thấy ${R.rows.length} giao dịch. Sửa hạng mục nếu cần — app sẽ nhớ cho lần sau. Dòng đánh dấu <span class="tag w">trùng?</span> có vẻ đã có sẵn nên đang bỏ chọn.</div>${R.errs.length?`<div class="err">${esc(R.errs.join('\n'))}</div>`:''}</div>
  ${R.rows.map((r,i)=>`<div class="rv ${r.sel?'':'off'}" id="rv${i}">
   <div class="row"><input class="fx" type="checkbox" ${r.sel?'checked':''} onchange="rv(${i},'sel',this.checked)"><div style="min-width:0"><b>${esc(r.n)}</b><div class="mut">${esc(r.v)}</div></div><b class="num fx ${cls(r.a)}">${fmt(r.a)}</b></div>
   <div class="mut" style="margin:4px 0"><span class="tag">${esc(r.b)}</span>${r.pend?'<span class="tag w">vorgemerkt</span>':''}${r.dup?'<span class="tag w">trùng?</span>':''}</div>
   <div class="row"><input type="date" value="${esc(r.d)}" onchange="rv(${i},'d',this.value)" style="flex:0 0 42%"><select onchange="rv(${i},'c',this.value)">${catOpts(r.c)}</select></div>
   <div style="margin-top:6px"><button class="s" onclick="rv(${i},'a',${-r.a});render()">Đổi dấu thu ↔ chi</button></div></div>`).join('')}
  <div class="row" style="position:sticky;bottom:70px;background:var(--bg);padding:8px 0"><button class="fx" onclick="S.review=null;render()">Huỷ</button><button class="p" id="rvs" onclick="saveReview()">Lưu ${n} giao dịch</button></div>`;
}
function rv(i,k,v){const r=S.review.rows[i];r[k]=v;if(k==='sel'){$('rv'+i).classList.toggle('off',!v);$('rvs').textContent='Lưu '+S.review.rows.filter(r=>r.sel).length+' giao dịch'}}
async function saveReview(){
  const sel=S.review.rows.filter(r=>r.sel&&r.d);const ps=[];
  for(const r of sel){const p={k:'tx',d:r.d,n:r.n,v:r.v,a:r.a,c:r.c,b:r.b,pend:r.pend,ts:Date.now()};ps.push(p);await put(uuid(),p)}
  await learn(ps);S.review=null;if(ps.length)S.ym=ps[0].d.slice(0,7);S.tab='tx';render();toast('Đã lưu '+ps.length+' giao dịch');kick();
}

/* ============ Einstellungen ============ */
function vSet(){
  const s=settings(),on=!!cfg.url;
  const link=on?location.origin+location.pathname+'#s='+encodeURIComponent(b64(te.encode(JSON.stringify({email:cfg.email,url:cfg.url,apikey:cfg.apikey})))):'';
  return `<div class="card"><h2>Nhận diện ảnh (Google Gemini)</h2>
  <label>Gemini API key</label><input id="sg" type="password" autocomplete="off" value="${esc(s.gem||'')}" placeholder="AIza…">
  <label>Model</label><input id="sm" value="${esc(s.model||'gemini-3.6-flash')}" autocapitalize="off">
  <div style="margin-top:10px"><button class="p" onclick="saveGem()">Lưu</button></div>
  <div class="mut" style="margin-top:8px">Key được mã hoá và tự đồng bộ sang máy thứ hai. Khi nhập ảnh, ảnh được gửi tới Google để đọc chữ; app không lưu ảnh.</div></div>

  <div class="card"><h2>Đồng bộ 2 điện thoại ${on?'<span class="tag">đang bật</span>':''}</h2>
  ${on?`<div class="mut">Máy chủ: ${esc(cfg.url)}<br>Lần đồng bộ cuối: ${cfg.lastSync?new Date(cfg.lastSync).toLocaleString('de-DE'):'—'} ${S.syncState==='⚠'?'<span class="err">'+esc(S.syncErr||'')+'</span>':''}</div>
  <div class="row" style="margin-top:10px"><button onclick="sync().then(()=>{render();toast('Đã đồng bộ')})">Đồng bộ ngay</button><button class="p" onclick="copy(decodeURIComponent('${encodeURIComponent(link)}'),'Đã chép link mời')">Chép link mời máy thứ 2</button></div>
  <div class="mut" style="margin-top:8px">Gửi link này cho vợ/chồng, mở bằng Safari, nhập mật khẩu gia đình. Link không chứa mật khẩu hay dữ liệu.</div>`
  :cfg.pend?`<div class="mut">Máy chủ đồng bộ đã được cài sẵn. Chỉ cần xác nhận e-mail gia đình (thư từ Supabase) rồi bấm Kết nối.</div>
  <input id="su" type="hidden" value="${esc(cfg.pend.url)}"><input id="sk" type="hidden" value="${esc(cfg.pend.apikey)}">
  <div style="margin-top:10px"><button class="p" id="sc" onclick="connect()">Kết nối</button></div><div class="err" id="serr">${esc(S.linkMsg||'')}</div>`
  :`<div class="mut">Tạo một project Supabase miễn phí (chọn vùng Frankfurt), chạy đoạn SQL dưới đây trong SQL Editor, rồi dán Project URL và API key (publishable / anon) vào đây. Máy chủ chỉ nhận dữ liệu đã mã hoá.</div>
  <pre id="sql">${esc(SQL)}</pre><button class="s" onclick="copy(SQL,'Đã chép SQL')">Chép SQL</button>
  <label>Project URL</label><input id="su" placeholder="https://xxxx.supabase.co" autocapitalize="off" value="${esc(cfg.pend?cfg.pend.url:'')}">
  <label>API key (publishable / anon)</label><input id="sk" autocapitalize="off" value="${esc(cfg.pend?cfg.pend.apikey:'')}">
  <div style="margin-top:10px"><button class="p" id="sc" onclick="connect()">Kết nối</button></div><div class="err" id="serr">${esc(S.linkMsg||'')}</div>`}</div>

  <div class="card"><h2>Sao lưu & bảo mật</h2>
  <div class="row"><button onclick="backup()">Tải file sao lưu (đã mã hoá)</button><button onclick="location.reload()">Khoá ngay</button></div>
  <div class="mut" style="margin-top:8px">Gia đình: ${esc(cfg.email)} · ${txs().length} giao dịch · Mã hoá AES-256-GCM, khoá tạo từ mật khẩu gia đình (PBKDF2, 600.000 vòng). App tự khoá sau 5 phút ở nền.</div>
  <div style="margin-top:10px"><button class="d s" onclick="wipe()">Xoá dữ liệu trên máy này</button></div></div>`;
}
async function saveGem(){const s=settings();s.gem=$('sg').value.trim();s.model=$('sm').value.trim()||'gemini-3.6-flash';await saveSettings(s);toast('Đã lưu')}
function copy(t,m){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>prompt('Chép thủ công:',t))}
async function linkSync(url,k){
  cfg.url=url;cfg.apikey=k;S.token=null;
  try{
    try{await login()}catch(er){
      if(/confirm/i.test(er.message+er.code))throw new Error('E-mail chưa được xác nhận. Mở thư Supabase gửi tới '+cfg.email+', bấm link xác nhận, rồi quay lại app bấm Kết nối.');
      if(!(await signup()))throw new Error('Đã gửi thư xác nhận tới '+cfg.email+'. Mở thư (xem cả mục Spam), bấm link xác nhận, rồi quay lại app bấm Kết nối. (Nếu e-mail này đã đăng ký trước đó với mật khẩu khác thì không kết nối được.)');
    }
    await rest('items?select=id&limit=1');
    for(const it of S.items.values()){it.dirty=true}
    await idbPut([...S.items.values()].map(i=>({id:i.id,data:i.data,deleted:i.deleted,dirty:true,updated_at:i.updated_at})));
    cfg.cursor=null;delete cfg.pend;S.linkMsg='';saveCfg();await sync();
  }catch(er){delete cfg.url;delete cfg.apikey;S.token=null;saveCfg();throw er}
}
function autoLink(){
  if(!cfg||cfg.url||!cfg.pend)return;
  linkSync(cfg.pend.url,cfg.pend.apikey).then(()=>{toast('Đã bật đồng bộ');render()},e=>{S.linkMsg=e.message;render()});
}
async function connect(){
  const url=$('su').value.trim().replace(/\/+$/,''),k=$('sk').value.trim(),e=$('serr');
  if(!validUrl(url)||!k){e.textContent='URL phải có dạng https://xxxx.supabase.co và cần API key.';return}
  $('sc').disabled=true;e.textContent='Đang kết nối…';
  try{await linkSync(url,k);render();toast('Đã kết nối')}catch(er){S.linkMsg=er.message;e.textContent=er.message;$('sc').disabled=false}
}
async function backup(){
  const rows=(await idbAll()).map(r=>({id:r.id,data:r.data,deleted:r.deleted}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'hbwa',v:1,email:cfg.email,rows})],{type:'application/json'}));a.download='haushalt-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* ============ Start ============ */
if(!window.isSecureContext||!crypto.subtle){$('lock').innerHTML='<h1>Haushalts-BWA</h1><div class="err">App cần chạy qua HTTPS (vd. GitHub Pages) để dùng được mã hoá.</div>'}
else lockScreen();
</script>
